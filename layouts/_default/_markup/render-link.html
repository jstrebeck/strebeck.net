{{- /* Markdown link render hook: open external links in a new tab, keep internal links in the same tab. */ -}}
{{- $external := or (strings.HasPrefix .Destination "http://") (strings.HasPrefix .Destination "https://") -}}
<a href="{{ .Destination | safeURL }}"
  {{- with .Title }} title="{{ . }}"{{ end -}}
  {{- if $external }} target="_blank" rel="noopener noreferrer"{{ end -}}
>{{ .Text }}</a>
